# The web UI and a same-origin proxy to the backend (compose.yaml, docs/desc/01-overview.md §1.8).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # "backend" is resolved per request through Docker's DNS, so this container starts and serves
    # the page on its own; while the backend is down the page waits and reconnects (app.js).
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_buffering off;      # stream the agent's steps as they happen
        proxy_read_timeout 600s;  # a local model on a slow machine may take minutes
        proxy_set_header Host $host;
    }
}
