name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: models/embeddings
          key: embeddings-${{ hashFiles('backend/adapters/embedder.py') }}
      - run: uv run python -m scripts.prepare_data
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: built
          path: |
            models/embeddings
            data/movies.json
            data/movie_vectors.npy
          include-hidden-files: true
          retention-days: 1

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The embedding model and the catalogue built by the check job: the image copies the model
      # instead of downloading it, the mounted data/ already holds the catalogue. No local model:
      # a 5.5 GB pull has no place in CI.
      - uses: actions/download-artifact@v4
        with:
          name: built
      - run: chmod -R a+rwX data # the backend runs as uid 1000
      - run: docker compose build frontend backend
      - run: docker compose up -d --wait --no-deps frontend backend
      - run: curl -fsS http://127.0.0.1:8000/api/config | python3 -c "import json, sys; assert json.load(sys.stdin)['movies'] > 2000"
      - run: curl -fsS http://127.0.0.1:8000/ | grep -q 'app.js'
      - if: always()
        run: docker compose logs backend frontend && docker compose down
